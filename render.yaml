services:
  # Flask RAG API Service
  - type: web
    name: flask-rag-api
    runtime: python
    rootDir: flask_api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: GROQ_API_KEY
        sync: false   # Set this manually in Render dashboard — never commit your key!
    healthCheckPath: /health
    autoDeploy: true
